[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "humming_bird_detection"
version = "0.0.1"
description = "Classifying bird observations from wildlife cameras."
authors = [{ name = "rgutzen" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
requires-python = "~=3.12"

dependencies = [
  "ruamel.yaml >=0.18.3",
  "pyyaml >=6.0",
  "numpy >=1.26.4",
  "pandas >=1.2.0",
  "torch >=2.2.0",
  "torchvision >=0.16.0",
  "opencv-python >=4.9.0",
  "pillow >=10.0.0",
  "matplotlib >=3.5.1",
  "seaborn >=0.13.0",
  "requests >=2.31.0",
  "wandb",
  "pytorch-lightning",
  "ultralytics",
  "easyocr",
  "sahi",
  "tqdm >=4.60.0",
]

[project.optional-dependencies]
gpu = [
  "cupy-cuda12x >= 13.3.0",
]

[project.scripts]
hbd = "humming_bird_detection.cli:cli"

[tool.pytest.ini_options]
markers = [
  "integration: tests that require real data files in data/raw/ and run the full pipeline (deselect with -m 'not integration')",
]

[tool.black]
line-length = 87
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''
