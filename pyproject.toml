[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "humming_bird_detection"
version = "0.0.1"
description = "A computer vision model for the detection and species classification of hummingbirds using bird feeder image datasets."
authors = [
  { name = "Surbhi, New York University, Courant" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "==0.0.1"


[tool.ruff]
line-length = 99
src = ["humming_bird_detection"]
include = ["pyproject.toml", "humming_bird_detection/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["humming_bird_detection"]
force-sort-within-sections = true

