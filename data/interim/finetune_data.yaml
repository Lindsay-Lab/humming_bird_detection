# Expected data folder structure:
# -------------------------------
# /path/to/your/train/
#     ├── images/
#     │   ├── image1.jpg
#     │   ├── image2.jpg
#     │   └── ...
#     └── labels/
#         ├── image1.txt
#         ├── image2.txt
#         └── ...
#
# The label txt file should be in the format:
#
# <class_id> <x_center> <y_center> <width> <height>
#
# where the coordinates are relative to the image size
        
# Path to the training images directory
train: ../raw/Trochilidae

# Path to the validation images directory
val: ../raw/Trochilidae

# Number of classes in the dataset
nc: 3

# Names of the classes
names: ['hummingbird', 'otherbird', 'nobird']